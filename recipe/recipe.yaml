context:
  version: 2026-02-08

package:
  name: marksman
  version: ${{ version | replace('-', '_') }}

source:
  - git: https://github.com/artempyanykh/marksman
    tag: ${{ version }}
  - url: https://github.com/artempyanykh/marksman/archive/refs/tags/${{ version }}.tar.gz
    sha256: a3ba5f8ef5be5d7ede2ec5ae9f303d2d776f476734ff66254be8e6df0e0f090e 
    target_directory: archive

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet
    - git
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - marksman --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Write Markdown with code assist and intelligence in the comfort of your favourite editor
  homepage: https://github.com/artempyanykh/marksman
  repository: https://github.com/artempyanykh/marksman

extra:
  recipe-maintainers:
    - anjos
    - danielnachun
    - ManifoldFR
